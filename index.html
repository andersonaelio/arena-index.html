/* parcelamento */
function formPlano(valorSugerido){
  const c = cli(ui.sel); if(!c) return;
  const s = saldo(c.id); if(s >= 0) return;
  if(planoAtivo(c.id)){ toast(`${c.nome} já tem um parcelamento. Pra refazer, cancele o atual em Mais opções.`); return; }
  const sugerido = Math.min(valorSugerido || -s, -s);
  abrirDialogo({ titulo:`Parcelar dívida de ${nomeCurto(c)}`, confirmar:'Criar parcelamento',
    corpo:`<div class="campo"><label for="plValor">Valor a parcelar (R$)</label><input id="plValor" inputmode="decimal" autocomplete="off" value="${centsInput(sugerido)}"></div>
      <div class="dois">
        <div class="campo"><label for="plN">Parcelas</label><input id="plN" inputmode="numeric" autocomplete="off" value="2"></div>
        <div class="campo"><label for="pl1">1º vencimento</label><input id="pl1" type="date" value="${addMeses(hojeISO(),1)}"></div>
      </div>
      <p class="dica">As próximas vencem no mesmo dia dos meses seguintes. Dá pra mudar a data e o valor de cada uma.</p>
      <ul class="pl-prev" id="plPrev" aria-label="Parcelas"></ul>`,
    aoConfirmar(){
      const total = parseValor($('#plValor').value), n = Number($('#plN').value);
      if(!total) return 'Digite o valor a parcelar, por exemplo 250.';
      if(!Number.isInteger(n) || n < 1 || n > 24) return 'Escolha de 1 a 24 parcelas.';
      const parcelas = [];
      for(let i = 0; i < n; i++){
        const v = parseValor($('#plv' + i)?.value), d = $('#pld' + i)?.value;
        if(!v) return `Confira o valor da ${i+1}ª parcela.`;
        if(!d) return `Escolha a data da ${i+1}ª parcela.`;
        parcelas.push({ valor:v, venc:d, pagaLanc:null });
      }
      const soma = parcelas.reduce((a,x) => a + x.valor, 0);
      if(soma !== total) return `As parcelas somam ${brl(soma)}, mas o total é ${brl(total)}. Ajuste os valores.`;
      parcelas.sort((a,b) => a.venc.localeCompare(b.venc));
      S.planos.push({ id:uid(), cid:c.id, total, criado:new Date().toISOString(), cancelado:false, parcelas });
      save(); render(); toast(`Parcelamento criado: ${brl(total)} em ${n}x.`);
    } });
  const gerar = () => {
    const total = parseValor($('#plValor').value), n = Number($('#plN').value), d1 = $('#pl1').value;
    const ul = $('#plPrev');
    if(!total || !Number.isInteger(n) || n < 1 || n > 24 || !d1){ ul.innerHTML = ''; return; }
    const base = Math.floor(total / n), resto = total - base * n;
    ul.innerHTML = Array.from({ length:n }, (_, i) => `<li><span>${i+1}ª</span>
      <input id="plv${i}" inputmode="decimal" autocomplete="off" aria-label="Valor da ${i+1}ª parcela" value="${centsInput(base + (i === 0 ? resto : 0))}">
      <input id="pld${i}" type="date" aria-label="Vencimento da ${i+1}ª parcela" value="${addMeses(d1, i)}"></li>`).join('');
  };
  ['plValor','plN','pl1'].forEach(id => $('#' + id).addEventListener('input', gerar));
  gerar();
}
function achaParcela(ref){ const [pid, i] = ref.split(':'); const pl = (S.planos || []).find(p => p.id === pid); return pl ? { pl, i:Number(i), x:pl.parcelas[Number(i)] } : null; }
function cobrarParcela(ref){
  const r = achaParcela(ref); if(!r || !r.x) return;
  const { pl, i, x } = r, c = cli(pl.cid);
  const num = waNumero(c.whats);

  const quando = d < 0 ? `que venceu em ${fmtData(x.venc)}` : d === 0 ? 'que vence hoje' : `que vence em ${fmtData(x.venc)}`;
  const msg = `Oi ${nomeCurto(c)}! Passando pra lembrar da ${i+1}ª parcela de ${pl.parcelas.length} do seu parcelamento na Arena Prime, no valor de ${brl(x.valor)}, ${quando}.`;

}

      ${novo ? '' : '<p class="dica">Compras antigas continuam com o preço da época.</p>'}`,
    aoConfirmar(){
      const nome = $('#ePNome').value.trim(), preco = parseValor($('#ePPreco').value), estoque = parseQtd($('#ePQtd').value), categoria = $('#ePCat').value.trim();
      if(!nome) return 'Digite o nome do produto.';
      if(!preco) return 'Digite o preço, por exemplo 25 ou 25,50.';
      if(Number.isNaN(estoque)) return 'Na quantidade, use só números inteiros, por exemplo 4. Ou deixe vazio.';
      if(S.produtos.some(x => x.id !== id && norm(x.nome) === norm(nome))) return 'Já existe um produto com esse nome. Pra somar unidades, use o + na lista.';
      ui.ultimaCatProd = categoria;
      if(novo) S.produtos.push({ id:uid(), nome, preco, estoque, categoria });
      else Object.assign(p, { nome, preco, estoque, categoria });
      save(); renderProdutos(); toast(novo ? 'Produto cadastrado.' : 'Produto atualizado.');
    } });
}
function removerProduto(id){
  const p = S.produtos.find(x => x.id === id); if(!p) return;
  abrirDialogo({ titulo:'Remover produto', confirmar:'Remover', perigo:true,
    corpo:`<p>Remover <strong>${esc(p.nome)}</strong>? Os lançamentos antigos com esse produto continuam no extrato.</p>`,
    aoConfirmar(){ S.produtos = S.produtos.filter(x => x.id !== id); ui.carrinho = ui.carrinho.filter(i => i.pid !== id); save(); renderProdutos(); toast('Produto removido.'); } });
}

/* ===== PDF (impressão do navegador) ===== */
function imprimir(html, titulo){
  const pa = $('#print');
  pa.innerHTML = html;
  const t = document.title;
  document.title = titulo;
  const fim = () => { document.title = t; pa.innerHTML = ''; window.removeEventListener('afterprint', fim); };
  window.addEventListener('afterprint', fim);
  window.print();
}
const hojeArquivo = () => new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
function pdfExtrato(){
  const c = cli(ui.sel); if(!c) return;
  const s = saldo(c.id);
  const rows = linhasExtrato(c.id).reverse();
  imprimir(`
    <div class="p-cab"><span class="p-marca">ARENA PRIME</span><span>Extrato de crédito da loja</span></div>
    <h1>${esc(c.nome)}</h1>${c.apelido ? `<p class="p-sub">${esc(c.apelido)}</p>` : ''}
    <p class="p-saldo">${s > 0 ? 'Crédito disponível' : s < 0 ? 'Valor em aberto' : 'Saldo'}: <strong>${brl(Math.abs(s))}</strong></p>
    <p class="p-emit">Emitido em ${dataHora(new Date().toISOString())}</p>
    ${(() => { const pl = planoAtivo(c.id); if(!pl) return ''; return `<h2>Parcelamento de ${brl(pl.total)} em ${pl.parcelas.length}x</h2>
      <table><thead><tr><th>Parcela</th><th>Vencimento</th><th class="n">Valor</th><th>Situação</th></tr></thead><tbody>${pl.parcelas.map((x,i) => `<tr><td>${i+1}ª</td><td>${fmtData(x.venc)}</td><td class="n">${brl(x.valor)}</td><td>${statusParcela(x).txt}</td></tr>`).join('')}</tbody></table>
      <h2>Movimentações</h2>`; })()}
    <table><thead><tr><th>Data</th><th>Descrição</th><th class="n">Entrada</th><th class="n">Saída</th><th class="n">Saldo</th></tr></thead>
    <tbody>${rows.length ? rows.map(l => `<tr><td>${dataHora(l.data)}</td><td>${esc(l.desc)}${estornado(l.id) ? ' (estornado)' : ''}</td><td class="n">${l.tipo === 'credito' ? brl(l.total) : ''}</td><td class="n">${l.tipo === 'debito' ? brl(l.total) : l.tipo === 'venda' ? `(${brl(l.total)} pago na hora)` : ''}</td><td class="n">${fmtSaldo(l.saldoApos)}</td></tr>`).join('') : '<tr><td colspan="5">Nenhum lançamento.</td></tr>'}</tbody></table>`,
    `Extrato ${c.nome} ${hojeArquivo()}`);
}
function pdfRelatorio(){
  const saldos = S.clientes.map(c => ({ c, s: saldo(c.id) })).sort((a,b) => b.s - a.s);
  const deveLoja = saldos.filter(x => x.s > 0).reduce((a,x) => a + x.s, 0);
  const receber = saldos.filter(x => x.s < 0).reduce((a,x) => a - x.s, 0);
  imprimir(`
    <div class="p-cab"><span class="p-marca">ARENA PRIME</span><span>Relatório de crédito da loja</span></div>
    <p class="p-emit">Emitido em ${dataHora(new Date().toISOString())}</p>
    <div class="p-totais"><div>Crédito dos clientes na loja<strong>${brl(deveLoja)}</strong></div><div>Fiado a receber<strong>${brl(receber)}</strong></div>${S.produtos.some(p => p.estoque != null) ? `<div>Valor em estoque<strong>${brl(S.produtos.filter(p => p.estoque != null).reduce((a,p) => a + p.preco * Math.max(p.estoque,0), 0))}</strong></div>` : ''}</div>
    <table><thead><tr><th>Cliente</th><th>Apelido</th><th>WhatsApp</th><th class="n">Crédito</th><th class="n">Deve</th></tr></thead>
    <tbody>${saldos.map(({c,s}) => `<tr><td>${esc(c.nome)}</td><td>${esc(c.apelido)}</td><td>${esc(c.whats)}</td><td class="n">${s > 0 ? brl(s) : ''}</td><td class="n">${s < 0 ? brl(-s) : ''}</td></tr>`).join('')}</tbody></table>`,
    `Relatorio credito Arena Prime ${hojeArquivo()}`);
}

/* ===== WhatsApp ===== */
function whatsExtrato(){
  const c = cli(ui.sel); if(!c) return;
  const num = waNumero(c.whats);
  if(!num){ toast(`Cadastre o WhatsApp de ${c.nome} pra mandar o extrato.`); formCliente(c.id); return; }
  const s = saldo(c.id);
  const nome = c.apelido || c.nome.split(' ')[0];
  const ult = linhasExtrato(c.id).slice(0,6);
  let msg = `Oi ${nome}! Segue seu extrato de crédito na Arena Prime.\n\n`;
  msg += s > 0 ? `Crédito disponível: ${brl(s)}` : s < 0 ? `Valor em aberto: ${brl(-s)}` : 'Saldo zerado.';
  if(s > 0 && !c.semValidade) creditoDetalhe(c.id).ativos.forEach(b => { msg += `\n${brl(b.valor)} de prêmio da liga vale até ${fmtData(b.vence)}`; });
  if(ult.length) msg += '\n\nÚltimas movimentações:\n' + ult.map(l => `${dataCurta(l.data)}  ${l.tipo === 'beneficio' ? '' : (l.tipo === 'credito' ? '+ ' : l.tipo === 'debito' ? '- ' : '') + brl(l.total) + '  '}${l.desc}`).join('\n');
  window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
}

/* ===== backup ===== */
function exportar(sufixo = ''){
  const d = new Date();
  const blob = new Blob([JSON.stringify({ app:'arenaprime-credito', versao:1, exportado:d.toISOString(), dados:{ clientes:S.clientes, produtos:S.produtos, lancs:S.lancs, planos:S.planos || [], ligas:S.ligas || [], ultimosPremios:S.ultimosPremios || [], config:S.config || {} } }, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `backup-credito-arena-prime-${d.toISOString().slice(0,10)}${sufixo}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  if(sufixo) return;
  S.ultimoBackup = d.toISOString(); save(); render();
  toast('Backup baixado. Guarde o arquivo no Google Drive ou no WhatsApp.');
}
$('#arqImport').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d;
    try{ const j = JSON.parse(r.result); d = j.dados || j; if(!Array.isArray(d.clientes) || !Array.isArray(d.lancs)) throw 0; }
    catch(_){ toast('Esse arquivo não é um backup deste sistema.'); return; }
    abrirDialogo({ titulo:'Restaurar backup', confirmar:'Substituir dados', perigo:true,
      corpo:`<p>O arquivo tem ${d.clientes.length} clientes e ${d.lancs.length} lançamentos.</p><p>Os dados atuais deste navegador (${S.clientes.length} clientes e ${S.lancs.length} lançamentos) vão ser substituídos. Antes disso, uma cópia deles é baixada automaticamente.</p>`,
      aoConfirmar(){
        if(!S.exemplo && (S.clientes.length || S.lancs.length)) exportar('-antes-de-restaurar');
        S = { ...vazio(), clientes:d.clientes, produtos:d.produtos || [], lancs:d.lancs, planos:d.planos || [], ligas:d.ligas || [], ultimosPremios:d.ultimosPremios || [], config:d.config || {}, ultimoBackup:new Date().toISOString() };
        ui.sel = null; ui.carrinho = []; document.body.classList.remove('ficha-aberta');
        save(); render(); toast('Backup restaurado.');
      } });
  };
  r.readAsText(f);
  e.target.value = '';
});
function apagarTudo(){
  abrirDialogo({ titulo:'Apagar todos os dados', confirmar:'Apagar tudo', perigo:true,
    corpo:`<p>Isso remove ${S.clientes.length} clientes, ${S.produtos.length} produtos e ${S.lancs.length} lançamentos deste navegador. ${S.exemplo ? '' : 'Uma cópia de segurança é baixada automaticamente antes.'}</p>
      <div class="campo"><label for="confApagar">Digite APAGAR pra confirmar</label><input id="confApagar" autocomplete="off"></div>`,
    aoConfirmar(){
      if($('#confApagar').value.trim().toUpperCase() !== 'APAGAR') return 'Digite APAGAR no campo pra confirmar.';
      if(!S.exemplo && (S.clientes.length || S.lancs.length)) exportar('-antes-de-apagar');
      S = vazio(); ui.sel = null; ui.carrinho = []; ui.cat = ''; document.body.classList.remove('ficha-aberta');
      save(); render(); toast('Todos os dados foram apagados.');
    } });
}
function carregarExemplo(){
  if(S.clientes.length || S.lancs.length) return;
  const agora = Date.now(), dia = 864e5;
  const P = (nome, preco, categoria, estoque = null) => ({ id:uid(), nome, preco, categoria, estoque });
  S.produtos = [P('Booster One Piece',2500,'One Piece',24), P('Deck inicial One Piece',9000,'One Piece',3), P('Booster Pokémon',2500,'Pokémon',18), P('Sleeve',3000,'Acessórios',10), P('Inscrição da liga',1500,'Liga')];
  S.exemplo = true;
  const C = (nome, apelido, whats) => ({ id:uid(), nome, apelido, whats, criado:new Date(agora - 12*dia).toISOString() });
  const [jo, ma, pe, an] = [C('João Exemplo','Jão','48 99999-0001'), C('Maria Exemplo','Mari',''), C('Pedro Exemplo','PH','48 99999-0003'), C('Ana Exemplo','','')];
  S.clientes = [jo, ma, pe, an];
  const L = (c, tipo, desc, total, dias) => ({ id:uid(), cid:c.id, tipo, total, itens:[], desc, data:new Date(agora - dias*dia).toISOString(), ...(tipo === 'debito' ? { compra:true } : {}) });
  S.lancs = [
    L(ma,'credito','Troca de cartas',4500,8),
    { ...L(jo,'credito','Prêmio da liga',6000,6), premio:true, vence:addDias(hojeISO(), VALIDADE_PREMIO - 6) },
    { ...L(ma,'credito','Prêmio da liga',4000,42), premio:true, vence:addDias(hojeISO(), VALIDADE_PREMIO - 42) },
    L(jo,'debito','2× Booster One Piece',5000,5),
    L(pe,'debito','Deck inicial One Piece',9000,4),
    L(ma,'debito','Booster Pokémon',2500,3),
    { ...L(pe,'credito','Pagamento (dinheiro)',5000,2), forma:'Dinheiro' },
    L(jo,'debito','Inscrição da liga',1500,1),
    ...Array.from({ length:10 }, (_, i) => ({ ...L(an,'venda','Inscrição da liga (pago no pix)',1500,70 - i*7), compra:true, forma:'Pix' })),
  ];
  const v1 = addDias(hojeISO(), -5);
  S.planos = [{ id:uid(), cid:pe.id, total:4000, criado:new Date(agora - 2*dia).toISOString(), cancelado:false,
    parcelas:[{ valor:2000, venc:v1, pagaLanc:null }, { valor:2000, venc:addMeses(v1,1), pagaLanc:null }] }];
  save(); render();
  toast('Dados de exemplo carregados.');
}

/* ===== eventos ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.view) return irPara(d.view);
  if(d.id) return abrirCliente(d.id);
  if(d.abrir) return abrirCliente(d.abrir);
  if(d.fluxo) return iniciarFluxo(d.fluxo);
  if(d.jog){ const L = ui.liga; if(L.sel[d.jog]) delete L.sel[d.jog]; else L.sel[d.jog] = L.padrao; $('#lgLista').innerHTML = lgListaHTML(); $('#lgFecha').innerHTML = lgFechaHTML(); $('#lgErro').textContent = ''; const b = document.querySelector(`[data-jog="${d.jog}"]`); if(b) b.focus(); return; }
  if(d.jforma){ const [id, f] = d.jforma.split(':'); ui.liga.sel[id] = f; $('#lgLista').innerHTML = lgListaHTML(); const b = document.querySelector(`[data-jforma="${d.jforma}"]`); if(b) b.focus(); return; }
  if(d.lpadrao){ const L = ui.liga; L.padrao = d.lpadrao; Object.keys(L.sel).forEach(id => { if(['Dinheiro','Pix','Cartão'].includes(L.sel[id])) L.sel[id] = d.lpadrao; }); renderLiga(); return; }
  if(d.cmodo){ ui.pc = { modo:d.cmodo }; atualizarLancar(); const b = document.querySelector(`[data-cmodo="${d.cmodo}"]`); if(b) b.focus(); return; }
  if(d.cforma){ ui.pc = { modo:ui.pc.modo, forma:d.cforma }; atualizarLancar(); const f = document.querySelector('[data-acao="confirmar-compra"]'); if(f) f.scrollIntoView({ block:'nearest' }); return; }
  if(d.cresto){ ui.pc = { modo:ui.pc.modo, resto:d.cresto }; atualizarLancar(); const f = document.querySelector('[data-acao="confirmar-compra"]'); if(f) f.scrollIntoView({ block:'nearest' }); return; }
  if(d.cparc){ ui.pc.parc = d.cparc; return atualizarLancar(); }
  if(d.pforma){ ui.forma = d.pforma; $('#pgErro').textContent = ''; document.querySelectorAll('[data-pforma]').forEach(x => x.setAttribute('aria-pressed', x === t)); atualizarCartaoPg(); return; }
  if(d.pagto){ ui.pagto = d.pagto; renderFluxo(cli(ui.sel)); if(d.pagto === 'outro'){ const i = $('#pgValor'); if(i) i.focus(); } else { const b = document.querySelector(`[data-pagto="${d.pagto}"]`); if(b) b.focus(); } return; }
  if(d.motivo){ $('#crMotivo').value = d.motivo; ui.crPremio = d.motivo === 'Prêmio da liga'; mostrarValidade(); document.querySelectorAll('[data-motivo]').forEach(x => x.setAttribute('aria-pressed', x === t)); $('#crValor').focus(); return; }
  if(d.menu){
    dlg.close();
    const pl = planoAtivo(ui.sel);
    switch(d.menu){
      case 'dar-credito': return iniciarFluxo('credito');
      case 'adiantou': return iniciarFluxo('pagou');
      case 'parcelar': return formPlano();
      case 'whats': return whatsExtrato();
      case 'pdf-extrato': return pdfExtrato();
      case 'editar': return formCliente(ui.sel);
      case 'cancelar-plano': return pl && cancelarPlano(pl.id);
      case 'remover-cliente': return removerCliente();
    }
    return;
  }
  if(d.cat !== undefined){ ui.cat = d.cat; S.ultimaCat = d.cat; save(); return atualizarLancar(); }
  if(d.produto) return addProdutoCarrinho(d.produto);
  if(d.qtd){ const [k, dx] = d.qtd.split(':').map(Number); const it = ui.carrinho[k]; if(!it) return; if(dx > 0 && it.pid){ const p = S.produtos.find(x => x.id === it.pid); if(p && !cabeNoEstoque(p, it.qtd + 1)) return; } it.qtd += dx; if(it.qtd < 1) ui.carrinho.splice(k,1); return atualizarLancar(); }
  if(d.tirar !== undefined){ ui.carrinho.splice(Number(d.tirar),1); return atualizarLancar(); }
  if(d.cobrar) return cobrarParcela(d.cobrar);
  if(d.avisarPremio) return avisarPremio(d.avisarPremio);
  if(d.cancelarPlano) return cancelarPlano(d.cancelarPlano);
  if(d.estornar) return estornar(d.estornar);
  if(d.estoque){ const [id, dx] = d.estoque.split(':'); const p = S.produtos.find(x => x.id === id); if(!p) return; p.estoque = Math.max(0, p.estoque + Number(dx)); save(); return renderProdutos(); }
  if(d.editarProd) return formProduto(d.editarProd);
  if(d.removerProd) return removerProduto(d.removerProd);
  switch(d.acao){
    case 'novo-cliente': return formCliente(null);
    case 'editar': return formCliente(ui.sel);
    case 'remover-cliente': return removerCliente();
    case 'voltar': ui.sel = null; ui.carrinho = []; ui.fluxo = null; document.body.classList.remove('ficha-aberta'); render(); return;
    case 'add-avulso': return addAvulso();
    case 'mais': return menuMais();
    case 'novo-jogador': return formCliente(null, { naLiga:true });
    case 'confirmar-liga': return confirmarLiga();
    case 'dar-premios': return darPremios();
    case 'mais-premios': ui.liga.maisPremios = true; ui.liga.premios = [{ cid:'', valor:'' }]; renderLiga(); { const x = $('#pr0'); if(x) x.focus(); } return;
    case 'add-premio': ui.liga.premios.push({ cid:'', valor:'' }); renderLiga(); { const x = $('#pr' + (ui.liga.premios.length - 1)); if(x) x.focus(); } return;
    case 'dar-beneficio': return darBeneficio();
    case 'novo-produto': return formProduto(null);
    case 'sair-fluxo': return sairFluxo();
    case 'confirmar-compra': return confirmarCompra();
    case 'confirmar-pagamento': return confirmarPagamento();
    case 'confirmar-credito': return confirmarCredito();
    case 'parcelar': return formPlano();
    case 'whats': return whatsExtrato();
    case 'pdf-extrato': return pdfExtrato();
    case 'pdf-relatorio': return pdfRelatorio();
    case 'exportar': return exportar();
    case 'importar': return $('#arqImport').click();
    case 'apagar-tudo': return apagarTudo();
    case 'exemplo': return carregarExemplo();
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.target.id === 'avValor' || e.target.id === 'avMotivo')){ e.preventDefault(); addAvulso(); }
  if(e.key === 'Enter' && e.target.id === 'pgValor'){ e.preventDefault(); confirmarPagamento(); }
  if(e.key === 'Enter' && (e.target.id === 'crValor' || e.target.id === 'crMotivo')){ e.preventDefault(); confirmarCredito(); }
  if(e.key === 'Escape' && ui.fluxo && !dlg.open){ e.preventDefault(); sairFluxo(); }
  if(e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !dlg.open){ e.preventDefault(); if(ui.view !== 'clientes') irPara('clientes'); $('#busca').focus(); }
});
$('#busca').addEventListener('input', e => { ui.busca = e.target.value; renderLista(); });
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'lgBusca'){ ui.liga.busca = t.value; $('#lgLista').innerHTML = lgListaHTML(); }
  if(t.id === 'lgValor'){ ui.liga.valor = t.value; $('#lgFecha').innerHTML = lgFechaHTML(); $('#lgErro').textContent = ''; $('#lgDivisao').textContent = divisaoTxt(); }
  if(t.id === 'lgLoja'){ const v = String(t.value).trim() === '' ? 0 : parseValor(t.value); if(v !== null){ S.config = { ...(S.config || {}), parteLoja: v }; save(); } $('#lgDivisao').textContent = v === null ? 'Valor da loja inválido.' : divisaoTxt(); $('#lgErro').textContent = ''; }
  if(t.dataset && t.dataset.prval !== undefined){ ui.liga.premios[Number(t.dataset.prval)].valor = t.value; $('#prErro').textContent = ''; const ps = $('#prSoma'); if(ps) ps.innerHTML = somaPremiosHTML(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.prsel !== undefined){ ui.liga.premios[Number(t.dataset.prsel)].cid = t.value; $('#prErro').textContent = ''; const ps = $('#prSoma'); if(ps) ps.innerHTML = somaPremiosHTML(); }
  if(t.id === 'lgValor') $('#lgLista').innerHTML = lgListaHTML();   // atualiza se "Crédito" aparece pra cada um
});
document.addEventListener('input', e => {
  if(e.target.id === 'pgValor'){ $('#pgErro').textContent = ''; atualizarPagto(); }
  if(e.target.id === 'cVezes' || e.target.id === 'cCobrado'){
    ui.pc[e.target.id === 'cVezes' ? 'vezes' : 'cobrado'] = e.target.value;
    const { total, resto, pc } = contaCompra(); const base = pc.modo === 'hora' ? total : resto;
    $('#cInfo').textContent = cartaoInfo(ui.pc, base); const er = $('#cErro'); if(er) er.textContent = '';
  }
  if(e.target.id === 'pVezes' || e.target.id === 'pCobrado'){
    ui.pcart[e.target.id === 'pVezes' ? 'vezes' : 'cobrado'] = e.target.value;
    if(e.target.id === 'pCobrado') ui.pcart.editado = true;
    $('#pInfo').textContent = cartaoInfo(ui.pcart, valorPagto()); $('#pgErro').textContent = '';
  }
  if(e.target.id === 'crValor' || e.target.id === 'crMotivo'){ $('#crErro').textContent = ''; atualizarCredito(); }
});
$('#busca').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ const b = document.querySelector('#listaClientes .linha-cli'); if(b) abrirCliente(b.dataset.id); }
});

window.addEventListener('storage', e => {
  if(e.key !== KEY) return;
  S = load(); ui.carrinho = []; ui.fluxo = null;
  if(ui.sel && !cli(ui.sel)){ ui.sel = null; document.body.classList.remove('ficha-aberta'); }
  if(dlg.open) dlg.close();
  render(); toast('Os dados foram alterados em outra aba e esta tela foi atualizada.');
});

render();
})();
